<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact &mdash; Christian Tiberia</title>
  <link rel="icon" type="image/png" href="images/CT Monogram.png" />
  <link rel="stylesheet" href="style.css?v=23" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
  <style>
    .contact-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 2.4rem 1.6rem 3rem;
    }
    .contact-wrap h1 {
      font-family: var(--font-display);
      font-weight: 900;
      color: var(--white);
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      letter-spacing: -0.01em;
      margin-bottom: .7rem;
    }
    .contact-wrap > p.dek {
      font-size: clamp(1.1rem, 1.3vw, 1.3rem);
      font-weight: 500;
      color: rgba(237,234,228,0.9);
      margin-bottom: 2.2rem;
      line-height: 1.6;
    }

    .form { display: flex; flex-direction: column; gap: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(237,234,228,0.85);
    }
    .field input, .field textarea {
      background: #151312;
      border: 1px solid rgba(237,234,228,0.14);
      color: var(--white);
      font-family: var(--font);
      font-size: 1.08rem;
      padding: 13px 15px;
      border-radius: 8px;
      outline: none;
      resize: none;
      width: 100%;
      transition: border-color .15s;
    }
    .field input::placeholder, .field textarea::placeholder { color: rgba(237,234,228,0.42); }
    .field input:focus, .field textarea:focus { border-color: var(--orange); }

    .submit-btn {
      align-self: flex-start;
      appearance: none;
      -webkit-appearance: none;
      background-color: #F7931A;
      background-image: none;
      color: var(--ink);
      font-family: var(--font-display);
      font-weight: 900;
      font-size: .85rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      padding: 13px 28px;
      border-radius: 999px;
      transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .85; }
    .submit-btn:disabled { opacity: .5; cursor: default; }

    .success { display: none; padding: 1.6rem 0; }
    .success strong {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 6px;
    }
    .success p { color: rgba(237,234,228,0.88); font-size: 1rem; }

    .direct {
      margin-top: 2.6rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(237,234,228,0.1);
    }
    .direct .social-label { text-align: left; }

    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-mark"><img src="images/CT Monogram.png" alt="Christian Tiberia — home" /></a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </div>
</nav>

<div class="contact-wrap">
  <h1>Get in touch</h1>
  <p class="dek">Whether you want to talk, collaborate, or just say something &mdash; reach out.</p>

  <div class="success" id="success">
    <strong>Message received</strong>
    <p>I'll get back to you soon.</p>
  </div>

  <form class="form" id="contactForm"
        action="https://formspree.io/f/mykaeeyw"
        method="POST">
    <div class="row">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" name="firstName" placeholder="John" required />
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" name="lastName" placeholder="Smith" required />
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" placeholder="john@example.com" required />
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="What's on your mind..." required></textarea>
    </div>
    <div>
      <button type="submit" class="submit-btn" id="submitBtn" style="background-color:#F7931A;">Send</button>
    </div>
  </form>

  <div class="direct">
    <div class="social-label">Reach me directly</div>
    <div class="social-row">
      <a href="mailto:ctiberia13@gmail.com" aria-label="Email me">
        <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#EDEAE4"/><rect x="4.5" y="6.5" width="15" height="11" rx="1.5" fill="none" stroke="#0d0d0d" stroke-width="1.5"/><path d="M5 7l7 5.5L19 7" stroke="#0d0d0d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="https://x.com/ChristianOnBTC" target="_blank" rel="noopener" aria-label="Follow on X">
        <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#EDEAE4"/><path d="M6.5 5.4h3.5l3 4.1 3.5-4.1h2l-4.6 5.3 4.9 6.9h-3.5l-3.2-4.5-3.8 4.5h-2l5-5.8z" fill="#0d0d0d"/></svg>
      </a>
      <a href="https://primal.net/christian21" target="_blank" rel="noopener" aria-label="Follow on Primal">
        <svg viewBox="0 0 256 256" fill="none"><path d="M126.074 0C197.002 0 254.5 57.3076 254.5 128C254.5 198.692 197.002 256 126.074 256C75.7248 256 32.1444 227.122 11.0931 185.079C4.86518 172.071 1.5 157.454 1.5 142.08C1.5 86.9399 46.3488 42.24 101.673 42.24C142.165 42.24 177.044 66.1859 192.835 100.644C193.592 102.295 191.145 103.784 189.786 102.576C180.707 94.5057 168.735 89.6 155.612 89.6C127.24 89.6 104.241 112.523 104.241 140.8C104.241 142.967 104.378 145.103 104.64 147.2V147.225C110.662 184.32 139.646 202.88 173.591 202.88C207.536 202.88 235.873 179.014 242.663 147.2C243.691 140.952 244.226 134.538 244.226 128C244.226 62.9629 191.327 10.24 126.074 10.24C86.7456 10.24 51.9053 29.3909 30.4289 58.8467C29.9396 59.5178 29.3768 60.133 28.7518 60.6809C22.2725 66.362 16.4662 72.7876 11.4678 79.8236C10.119 81.7221 6.84452 80.2871 7.75432 78.1448C27.2579 32.2207 72.89 0 126.074 0Z" fill="url(#primal-g)"/><defs><linearGradient id="primal-g" x1="9.1334" y1="3.58879" x2="260.347" y2="255.639" gradientUnits="userSpaceOnUse"><stop stop-color="#00E0FF"/><stop offset="0.481323" stop-color="#0090F8"/><stop offset="1" stop-color="#2554ED"/></linearGradient></defs></svg>
      </a>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 Christian Tiberia</p>
</footer>

<script>
  const form = document.getElementById('contactForm');
  const btn  = document.getElementById('submitBtn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.textContent = 'Sending...';
    btn.disabled = true;
    try {
      const res = await fetch(form.action, {
        method: 'POST', body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.style.display = 'none';
        document.getElementById('success').style.display = 'block';
      } else {
        btn.textContent = 'Send';
        btn.disabled = false;
        alert('Something went wrong — email me directly at ctiberia13@gmail.com');
      }
    } catch (err) {
      btn.textContent = 'Send';
      btn.disabled = false;
      alert('Something went wrong — email me directly at ctiberia13@gmail.com');
    }
  });
</script>
</body>
</html>
