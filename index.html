  <style>
    .hero {
      position: relative;
      width: 100%;
      min-height: min(72vh, 640px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hero-photo {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 44%;
      background-image: url("images/Christian Black.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center 14%;
      filter: sepia(0.4) saturate(1.15) brightness(0.85) contrast(1.05);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 30%);
      mask-image: linear-gradient(90deg, transparent 0%, black 30%);
    }
    .hero-main {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 50%;
      max-width: 620px;
      padding: 0 1rem 2.2rem 6vw;
    }
    .hero-name {
      font-family: var(--font-display);
      font-weight: 900;
      color: var(--white);
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }
    .hero-name .rule { margin-top: 1rem; }
    .hero-bottombar {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      padding: 1.4rem 6vw 2.2rem;
      background: linear-gradient(0deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.25) 65%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }

    @media (max-width: 760px) {
      .hero { min-height: auto; }
      .hero-photo {
        position: relative;
        width: 100%;
        height: 260px;
        -webkit-mask-image: linear-gradient(180deg, black 68%, transparent 100%);
        mask-image: linear-gradient(180deg, black 68%, transparent 100%);
      }
      .hero-main {
        width: 100%;
        max-width: none;
        align-items: center;
        text-align: center;
        padding: 2.2rem 1.6rem 0;
      }
      .hero-main .rule { margin-left: auto; margin-right: auto; }
      .hero-bottombar {
        align-items: center;
        padding: 1.2rem 1.6rem 2.4rem;
        background: none;
      }
      .cta-row, .social-row { justify-content: center; }
    }
  </style>
</head>
